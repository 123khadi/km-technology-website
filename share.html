<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Share Calculator</title>
  <style>
    .share-btn, .share-links a, .share-links button {
  padding: 10px 16px;
  font-size: 14px;
  background-color: #007bff;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  text-decoration: none;
  display: inline-block;
  margin-right: 8px;
}

.share-btn:hover, .share-links a:hover, .share-links button:hover {
  background-color: #0056b3;
}
  </style>
  </head>
  <body>
    <div class="share-links">
  <!-- Copy Link -->
  <button onclick="navigator.clipboard.writeText(window.location.href); alert('Link copied!');">
    Copy Link
  </button>

  <!-- Twitter / X -->
  <a href="#" onclick="window.open('https://twitter.com/intent/tweet?url=' + encodeURIComponent(window.location.href), '_blank')">
    Share on X
  </a>

  <!-- Facebook -->
  <a href="#" onclick="window.open('https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(window.location.href), '_blank')">
    Share on Facebook
  </a>

  <!-- WhatsApp -->
  <a href="#" onclick="window.open('https://api.whatsapp.com/send?text=' + encodeURIComponent(window.location.href), '_blank')">
    Share on WhatsApp
  </a>
</div>
<button id="shareButton" class="share-btn">Share This Page</button>

<script>
  document.getElementById('shareButton').addEventListener('click', async () => {
    if (navigator.share) {
      try {
        await navigator.share({
          title: document.title,
          url: window.location.href
        });
      } catch (err) {
        console.log('Error sharing:', err);
      }
    } else {
      // Fallback: Copy link to clipboard if Web Share API is not supported
      navigator.clipboard.writeText(window.location.href);
      alert('Link copied to clipboard!');
    }
  });
</script>
  </body>
</html>
